name: probe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: probe
        env:
          SQD_API_KEY: ${{ secrets.SQD_API_KEY }}
        run: python probe.py
      - name: commit result
        if: always()
        run: |
          git config user.name "meter-bot"
          git config user.email "meter-bot@users.noreply.github.com"
          git add probe/result.json
          git commit -m "probe result" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
