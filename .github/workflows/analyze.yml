name: analyze
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: analyze
        run: python prereg/analyze.py --out out --res results --start 2026-08-07 --end 2026-11-14 --before-start 2026-07-08 --before-end 2026-08-06
      - name: commit
        run: |
          git config user.name "meter-bot"
          git config user.email "meter-bot@users.noreply.github.com"
          git add results
          git commit -m "results" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep 5; done
